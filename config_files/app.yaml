probability: 0.2
universal-set: 100

message-pattern: '(?i)(^|[^\p{L}])(chửi|đĩ|ktv|buscu|póng chan|pông nan|long xiên|join fast|bô|safe|bê đê|pê đê|buê đuê|nghèo|nwng|nứng|tnt|sạc|bú|pú|bóng|póng|địt|nợ|tri sâm|sự kiện 244|bot ngu)($|[^\p{L}])'
video-url-pattern: 'https?://(?:www\.)?(?:facebook\.com/(?:watch/?\?v=|share/[rv]/|reel/|[^/]+/videos/|story\.php\?story_fbid=)[a-zA-Z0-9_\-&=?]+|youtube\.com/(?:watch\?v=|shorts/)[a-zA-Z0-9_-]{11}|youtu\.be/[a-zA-Z0-9_-]{11})'
iotio-pattern: '(\s?)(đần|ngu|thiểu năng|Đần)(\s?)'

session:
  intent-pattern:
    confirm: '(?i)^(chắc|ok|okay|ừ|uh|yes|y|được|làm đi|triển)$'
    cancel: '(?i)^(không|khong|no|n|thôi|bỏ|cancel|hủy)$'
  command-pattern:
    timeout:
    - "(?i).*timeout.*"
    - "(?i).*phạt.*"
    - "(?i).*cho.*timeout.*"
    remove-timeout:
    - "(?i).*remove.*timeout.*"
    - "(?i).*gỡ.*timeout.*"
    - "(?i).*bỏ.*timeout.*"
    nickname:
    - "(?i).*đổi.*nick.*"
    - "(?i).*đổi.*nickname.*"
    role:
    - "(?i).*assign.*role.*"
    - "(?i).*cho.*role.*"
    pile-on:
    - "(?i)^(ko|không).*mày"
